# pluvian release — publish @erkos/pluvian to npm on a vX.Y.Z tag.
#
# Uses npm Trusted Publishing (OIDC) — NO stored NPM_TOKEN. The GitHub
# Actions OIDC token is exchanged for a short-lived npm publish token at
# publish time. Requires the Trusted Publisher to be configured on npmjs.com:
#   repository owner = ealmachado-eng, name = pluvian, workflow = release.yml
# (see .claude/skills/pluvian-release/SKILL.md — a mismatch surfaces only at
# publish time as ENEEDAUTH).
#
# The repo is PUBLIC on GitHub → `--provenance` works (sigstore attestation
# on the npm page). This was E422-blocked on the old private GitLab repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Correctness gate — mirrors ci.yml's `test` job. publish runs ONLY after
  # this passes, so a tag pushed with a failing check does NOT ship to npm.
  # (Security scans — audit/semgrep/gitleaks — run on every push to main and
  # PR via ci.yml; a tag points at an already-merged, already-scanned commit,
  # so they're not re-run here. ci.yml does not fire on tags.)
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run coverage
      - run: npm run check-docs

  publish:
    needs: [gate]
    runs-on: ubuntu-latest
    # REQUIRED for npm trusted publishing (OIDC) — without `id-token: write`
    # the OIDC token isn't issued and `npm publish` fails auth.
    permissions:
      contents: read
      id-token: write
    # No `environment:` — keeps the OIDC claim matching the simplest npm
    # trusted-publisher config (owner + repo + workflow, no environment pin).
    # Add `environment: release` only if you also pin it on npmjs.com AND want
    # environment-scoped protection rules / secrets.
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 → npm 11.x. Trusted publishing (the OIDC → publish-token
          # exchange) REQUIRES npm CLI ≥ 11.5.1; Node 20 ships npm 10.x, which
          # is too old — the exchange silently fails and the PUT goes anonymous
          # → 404 "not in this registry". (Provenance signing still worked on
          # Node 20 because sigstore uses the GitHub OIDC token directly, not
          # the npm publish token — masking the failure.)
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Public repo → sigstore provenance attestation lands on the npm page.
      - run: npm publish --access public --provenance
