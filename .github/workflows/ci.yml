# pluvian CI — the non-bypassable quality/security gate (doc 07).
# Mirrors the local subagents (test-runner, code-quality, security-scan)
# with the SAME tools, so local and CI never disagree.
#
# Public repo → GitHub grants unlimited Actions minutes, so the full gate
# runs on every push and PR at no cost. (Self-hosting is optional — see
# docs/dev/setup-runner.md.) The publish flow lives in release.yml.
#
# Two `auto` community rules are excluded as semgrep false positives for a
# LOCAL, file-processing CLI (there is no server / privilege boundary):
#  - path-join-resolve-traversal: pluvian reads the developer's own Terraform
#    at developer-supplied paths — intended behavior, not a traversal vuln.
#  - detect-non-literal-regexp: the only dynamic regexes are built from
#    escapeRegExp()-escaped input / fixed iterator names (ReDoS-safe; they
#    carry eslint-disable justifications in the source).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual fallback — run the gate on demand (e.g. when GitHub drops a push event)

# Cancel superseded runs on the same ref (free-tier courtesy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── test + code-quality (mirrors the test-runner + code-quality agents) ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      # `npm install`, NOT `npm ci` — the test toolchain (vitest → vite →
      # rolldown) ships platform-specific optional native bindings whose
      # transitive @emnapi versions resolve differently on Linux than in a
      # lockfile generated on another OS, which can make `npm ci` reject an
      # otherwise-valid lock. `npm install` honors the committed lock but
      # tolerates that per-platform optional resolution. The lock stays the
      # source of truth. (Prod deps — @cdktf/hcl2json, jiti — are unaffected.)
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run coverage
      # Rule-doc freshness: docs/user/reference/rules/ must match gen-docs
      # output. A preset change without regenerating blocks the gate.
      - run: npm run check-docs

  # ── VS Code extension (spec 11) — gates + staged-VSIX smoke ──
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            packages/vscode/package-lock.json
      # The engine link (file:../cli) resolves its runtime deps from
      # packages/cli/node_modules and its TYPES from packages/cli/dist —
      # install + build the engine package first.
      - name: Install engine package
        run: npm install --no-audit --no-fund
        working-directory: packages/cli
      - name: Build engine dist
        run: npm run build
        working-directory: packages/cli
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Package VSIX (staged closure)
        run: npm run package
      - name: Smoke — bundled engine checks demo/ from the extracted VSIX
        run: npm run smoke

  # ── security-scan agent's tools, run authoritatively ──
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run the raw semgrep CLI (not the semgrep-action) so the command is
      # byte-for-byte identical to the local subagent invocation — the core
      # gate principle (local and CI never disagree).
      - run: pipx install semgrep
      - name: semgrep scan
        run: |
          semgrep scan --config auto --error \
            --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            packages/cli/src

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — gitleaks scans the whole repo
      # Direct gitleaks binary (not gitleaks-action): the action requires a
      # GITLEAKS_LICENSE for ORGANIZATION repos (free key from gitleaks.io,
      # but issued per org name — this repo moved to the erkos-hq org
      # 2026-09-01 and the action's license gate began failing). Same engine,
      # same .gitleaks.toml rules. Version + sha256 are pinned manually —
      # Renovate cannot bump this (the tradeoff the old comment warned
      # about; the org license gate outranked it). If a correctly-issued
      # license for `erkos-hq` lands later, the action can return.
      - name: gitleaks detect (v8.30.1, checksum-pinned)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum --check
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
